version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: migration-platform-postgres
    environment:
      POSTGRES_DB: lextr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: migration-platform-clickhouse
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    ports:
      - "8123:8123"
      - "9000:9000"

  migration-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: migration-platform-app
    depends_on:
      - postgres
      - clickhouse
    environment:
      LEXTR_POSTGRES_PASSWORD: admin
      LEXTR_CLICKHOUSE_PASSWORD: ""
    ports:
      - "8049:8049"
