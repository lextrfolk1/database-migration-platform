name: database-migration-platform

# Starts the ClickHouse dependency for local development.
# PostgreSQL and the migration-platform app run outside Docker.

services:
  clickhouse:
    # Matches infrastructure/deployments/infrastructure/datastores/clickhouse/deployment.yaml.
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: database-migration-platform-clickhouse
    environment:
      CLICKHOUSE_DB: data
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${LEXTR_CLICKHOUSE_PASSWORD:-clickhouse}
    ports:
      - "8123:8123"
      - "9000:9000"
