defaultEnvironment: dev

targets:
  postgres-main-dev:
    type: postgres
    environment: dev
    url: jdbc:postgresql://localhost:5433/lextr
    username: lextr_user
    passwordEnv: LEXTR_POSTGRES_PASSWORD
    schemas:
      - meta
      - data
    baselineOnMigrate: true
    baselineVersion: "0"
    cleanDisabled: false
    historyTablePrefix: flyway_history

  clickhouse-analytics-dev:
    type: clickhouse
    environment: dev
    url: jdbc:clickhouse://localhost:8123/default
    username: default
    passwordEnv: LEXTR_CLICKHOUSE_PASSWORD
    baselineOnMigrate: false
    baselineVersion: "0"
    cleanDisabled: true
    historyTablePrefix: flyway_history

services:
  generic-service:
    targetMappings:
      - target: postgres-main-dev
        locations:
          - filesystem:src/main/resources/migrations/generic-service/postgres
      - target: clickhouse-analytics-dev
        locations:
          - filesystem:src/main/resources/migrations/generic-service/clickhouse

  semantic-service:
    targetMappings:
      - target: postgres-main-dev
        locations:
          - filesystem:src/main/resources/migrations/semantic-service/postgres
