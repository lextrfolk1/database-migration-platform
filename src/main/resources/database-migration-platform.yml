defaultEnvironment: dev

targets:
  postgres-main-dev:
    type: postgres
    environment: dev
    url: jdbc:postgresql://localhost:5433/lextr
    username: lextr_user
    passwordEnv: LEXTR_POSTGRES_PASSWORD
    schemas:
      - meta
      - data
    baselineOnMigrate: true
    baselineVersion: "0"
    cleanDisabled: false
    historyTablePrefix: flyway_history

  clickhouse-analytics-dev:
    type: clickhouse
    environment: dev
    # v1 driver: the 0.9.x v2 driver cannot parse Flyway's parameterized history-table queries.
    url: jdbc:clickhouse://localhost:8123/default?clickhouse.jdbc.v1=true
    username: default
    passwordEnv: LEXTR_CLICKHOUSE_PASSWORD
    baselineOnMigrate: false
    baselineVersion: "0"
    cleanDisabled: true
    historyTablePrefix: flyway_history

# Locations are relative to migration.platform.migrations-root (default: src/main/resources/migrations).
services:
  database-scripts:
    targetMappings:
      - target: postgres-main-dev
        locations:
          - database-scripts/postgres
        # Never auto-baseline: a baseline at version 0 would silently skip V0__schema_creation.
        baselineOnMigrate: false
      - target: clickhouse-analytics-dev
        locations:
          - database-scripts/clickhouse

  semantic-service:
    targetMappings:
      - target: postgres-main-dev
        locations:
          - semantic-service/postgres

  intelligence-service:
    targetMappings:
      - target: postgres-main-dev
        locations:
          - intelligence-service/postgres

  workflow-service:
    targetMappings:
      - target: postgres-main-dev
        locations:
          - workflow-service/postgres

  lexie-ai:
    targetMappings:
      - target: postgres-main-dev
        locations:
          - lexie-ai/postgres
