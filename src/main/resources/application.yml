server:
  port: 8049
spring:
  application:
    name: database-migrator
  datasource:
    url: jdbc:postgresql://localhost:5433/lextr
    username: postgres
    driver-class-name: org.postgresql.Driver
    password: admin
  flyway:
    baseline-on-migrate: true
    cleanDisabled: false
    schemas: meta,data
    enabled: false
    locations:
      -- classpath:db/init/02_generic_service
      -- classpath:db/init/03_workflow_service

logging:
  level:
    org.flywaydb: DEBUG
