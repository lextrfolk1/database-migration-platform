defaultEnvironment: dev
environments:
  dev:
    services:
      customer-service:
        postgres:
          url: jdbc:postgresql://localhost:5433/lextr
          username: postgres
          passwordEnv: LEXTR_POSTGRES_PASSWORD
          schemas:
            - meta
            - data
          baselineOnMigrate: true
          cleanDisabled: false
          locations:
            - classpath:db/init/00_schema
            - classpath:db/init/01_generic_service
        clickhouse:
          url: jdbc:clickhouse://localhost:8123/default
          username: default
          passwordEnv: LEXTR_CLICKHOUSE_PASSWORD
          baselineOnMigrate: true
          cleanDisabled: true
          locations:
            - classpath:migrations/customer-service/clickhouse
